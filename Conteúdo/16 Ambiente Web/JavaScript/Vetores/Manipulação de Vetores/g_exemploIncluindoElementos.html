<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Inclusão de Elementos</title>
	</head>
	<body>
		<script>
			const valores = [3, 1, 7, 8, 4];
			console.log(valores); // 3, 1, 7, 8, 4
			valores.push(5);
			console.log(valores); // 3, 1, 7, 8, 4, 5
			valores.unshift(6);
			console.log(valores); // 6, 3, 1, 7, 8, 4, 5
		</script>
	</body>
</html>
