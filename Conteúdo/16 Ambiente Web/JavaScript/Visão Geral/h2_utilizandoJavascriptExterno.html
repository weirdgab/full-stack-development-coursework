<html>
	<head>
		<meta charset="utf-8" />
		<title>Utilizando JavaScript Externo</title>
	</head>
	<body>
		<!--Importação no HTML-->
		<script src="h1_utilizandoJavascriptExterno.js"></script>
		<button onClick="execFatorial()">Fatorial</button>
		<button onClick="execSomatorio()">Somatório</button>
		<script>
			execFatorial = () => {
				let numero = eval(prompt('Valor'));
				alert(`Fatorial de ${numero}: ${fatorial(numero)}`);
			};
			execSomatorio = () => {
				const valores = [1, 2, 3, 4, 5, 6];
				alert(`Soma dos números de 1 a 6: ${somatorio(valores)}`);
			};
		</script>
	</body>
</html>
