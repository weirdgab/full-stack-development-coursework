<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Box Model em CSS</title>
		<style type="text/css">
			div {
				color: #fff;
				font-weight: bold;
				font-size: 20px;
			}

			#box-inicial {
				width: 400px;
				height: 200px;
				background-color: red;
			}

			#box-exemplo {
				width: 400px;
				height: 200px;
				background-color: blue;
				margin: 30px, 20px, 50px, 15px;
				padding: 50px;
				border: 10px solid black;
			}

			#box-final {
				width: 400px;
				height: 200px;
				background-color: green;
			}
		</style>
	</head>
	<body>
		<div id="box-inicial">Conteúdo do box inicial.</div>
		<div id="box-exemplo">Conteúdo do box exemplo.</div>
		<div id="box-final">Conteúdo do box final.</div>
	</body>
</html>
