<doctype html>
	<html>
		<head>
			<style>
				@font-face {
					font-family: 'GoogleSans';
					src: url('Fonts/GoogleSans-VariableFont.ttf') format('ttf');
					font-weight: bold;
					font-style: normal;
				}

				@font-face {
					font-family: 'Roboto';
					src: url('Fonts/Roboto-VariableFont.ttf') format('ttf');
					font-weight: bold;
					font-style: normal;
				}

				#primeiro-paragrafo {
					font-family: GoogleSans;
				}

				#segundo-paragrafo {
					font-family: Roboto;
				}
			</style>
		</head>
		<body>
			<h1>Usando Web Fontes</h1>
			<p id="primeiro-paragrafo">Parágrafo 1 para o teste de fontes.</p>
			<p id="segundo-paragrafo">Parágrafo 2 para o teste de fontes.</p>
		</body>
	</html>
</doctype>
