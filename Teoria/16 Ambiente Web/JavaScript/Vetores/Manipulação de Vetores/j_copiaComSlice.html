<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Cópia com Slice</title>
	</head>
	<body>
		<script>
			const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];
			const dias_uteis = dias.slice(1, 6); //Início e fim + 1
			console.log(dias);
			console.log(dias_uteis);
		</script>
	</body>
</html>
